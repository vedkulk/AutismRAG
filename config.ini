# ============================================================
#  AutismRAG Configuration
#  Edit these values to match your setup
# ============================================================

[ollama]
# Base URL for your running Ollama instance
base_url = http://localhost:11434

# Model used for answering questions (Phase 2+)
llm_model = llama3.1

# Embedding model — pull with: ollama pull nomic-embed-text
embed_model = nomic-embed-text

[paths]
# Drop your medical PDFs / text files here
kb_data_dir = ./data/kb_pdfs

# ChromaDB will persist here
chroma_db_dir = ./data/chroma_kb

# Logs directory
log_dir = ./logs

[chunking]
# Characters per chunk (~256-512 tokens for nomic-embed-text)
chunk_size = 300

# Overlap between consecutive chunks (~12.5% of chunk size)
chunk_overlap = 40

# Minimum chunk size — smaller chunks are discarded
min_chunk_size = 80

[retrieval]
# Number of chunks to retrieve from KB per query (over-retrieve for reranking)
kb_top_k = 25

# Number of chunks to retrieve from report per query (Phase 2)
report_top_k = 4

# Retrieval strategy: similarity | mmr
retrieval_type = mmr

# MMR diversity parameter (0=max relevance, 1=max diversity)
mmr_lambda = 0.5

[advanced_rag]
# Phase 4 — Advanced RAG techniques (each independently toggleable)
hyde_enabled = false
query_rewriting_enabled = true
cross_encoder_enabled = true
compression_enabled = true

# Cross-encoder model for re-ranking (auto-downloaded on first use, ~80 MB)
cross_encoder_model = cross-encoder/ms-marco-MiniLM-L-6-v2

# Number of top chunks to keep after re-ranking
rerank_top_k = 8

# Number of chunks to compress (should be <= rerank_top_k)
compression_top_k = 4

[evaluation]
# Path to the evaluation dataset
eval_dataset = ./data/eval_dataset.json

# Directory to save evaluation reports
eval_output_dir = ./logs

# Number of hypothetical questions to generate for answer relevancy
num_relevancy_questions = 3

[chroma]
# Name of the persistent KB collection in ChromaDB
kb_collection_name = autism_kb_medical_guidelines

# Distance metric: cosine | l2 | ip
distance_metric = cosine

